name: Frontend CI

on:
  pull_request:
    branches:
      - main

jobs:
  build-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.jsg
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build Angular application
        run: npm run build

      - name: Publish build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist